[project]
name = "git-repo-checker"
version = "0.1.0"
description = "扫描多个工作目录，汇总展示 git 仓库的未提交 / 未推送 / 未同步状态（GUI）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
git-repo-checker = "main:main"
git-repo-checker-dev = "dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
